<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a6b"/>
      <stop offset="0.55" stop-color="#1f5fd1"/>
      <stop offset="1" stop-color="#19b8d6"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe9ff"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f5fd1"/>
      <stop offset="1" stop-color="#19b8d6"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="26" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="inner" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="squircle"><path d="M512 40c231 0 300 0 386 86s86 155 86 386-0 300-86 386-155 86-386 86-300 0-386-86S40 743 40 512s0-300 86-386S281 40 512 40z"/></clipPath>
  </defs>
  <!-- macOS squircle background -->
  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <!-- soft light sweep -->
    <ellipse cx="300" cy="180" rx="520" ry="300" fill="#ffffff" opacity="0.10"/>
    <rect width="1024" height="1024" fill="url(#gloss)"/>
    <!-- faint orbit lines suggesting places -->
    <g fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="10">
      <circle cx="512" cy="540" r="330"/>
      <circle cx="512" cy="540" r="410"/>
    </g>
  </g>
  <!-- shield -->
  <g filter="url(#shadow)">
    <path d="M512 150 L790 250 C790 520 700 720 512 880 C324 720 234 520 234 250 Z" fill="url(#shield)"/>
  </g>
  <!-- shield inner edge -->
  <path d="M512 196 L748 282 C748 512 672 690 512 830 C352 690 276 512 276 282 Z" fill="none" stroke="#1f5fd1" stroke-opacity="0.18" stroke-width="8"/>
  <!-- three stacked copies: Mac, disk, cloud -->
  <g>
    <rect x="356" y="330" width="312" height="78" rx="26" fill="url(#bar)"/>
    <rect x="386" y="446" width="252" height="78" rx="26" fill="url(#bar)" opacity="0.86"/>
    <rect x="416" y="562" width="192" height="78" rx="26" fill="url(#bar)" opacity="0.72"/>
    <!-- little indicator dots on each copy -->
    <circle cx="396" cy="369" r="14" fill="#ffffff" opacity="0.9"/>
    <circle cx="426" cy="485" r="14" fill="#ffffff" opacity="0.9"/>
    <circle cx="456" cy="601" r="14" fill="#ffffff" opacity="0.9"/>
  </g>
  <!-- verified tick badge -->
  <g filter="url(#shadow)">
    <circle cx="690" cy="700" r="108" fill="#22c55e"/>
    <circle cx="690" cy="700" r="108" fill="none" stroke="#ffffff" stroke-width="22"/>
    <path d="M636 704 L674 742 L748 660" fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
